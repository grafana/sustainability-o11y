name: Tests (aws-water-exporter)

on:
  push:
    branches: ["main"]
    paths:
      - "aws-water-exporter/**"
  pull_request:
    branches: ["main"]
    paths:
      - "aws-water-exporter/**"

jobs:
  build-lint-test:
    permissions:
      pull-requests: read
      contents: read
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: aws-water-exporter
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-goversion
        with:
          component-dir: aws-water-exporter
      - name: Build
        run: go build -v ./...
      - name: Lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.14.0
          working-directory: aws-water-exporter
      - name: Test
        run: go test -v ./...
